<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Smart HR - 社員ログイン</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

<div class="login-card p-4 p-sm-5 text-white">
  <div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 56px; height: 56px;">
      <i class="bi bi-building-fill-check fs-2"></i>
    </div>
    <h4 class="fw-bold">Smart HR ポータル</h4>
    <p class="text-muted small">社員番号とパスワードを入力してください。</p>
  </div>

  <!-- エラー / ログアウト メッセージ -->
  <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
    社員番号またはパスワードが正しくありません。
  </div>
  <div th:if="${param.logout}" class="alert alert-info py-2 small" role="alert">
    ログアウトしました。
  </div>

  <form th:action="@{/login-process}" method="post">
    <div class="mb-3">
      <label for="employeeNo" class="form-label small text-muted">社員番号</label>
      <div class="input-group">
        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person-badge"></i></span>
        <input type="text" class="form-control bg-dark border-secondary text-white" id="employeeNo" name="employeeNo" placeholder="例: 20261012" value="20261012" required>
      </div>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label small text-muted">パスワード</label>
      <div class="input-group">
        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
        <input type="password" class="form-control bg-dark border-secondary text-white" id="password" name="password" placeholder="パスワードを入力" value="1234" required>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
      ログイン
    </button>
  </form>

  <div class="text-center text-muted small mt-4">
    * テスト用アカウント: 社員番号 <code>20261012</code> / パスワード <code>1234</code>
  </div>
</div>

</body>
</html>
